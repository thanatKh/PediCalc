<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>PediCalc</title>
    <meta name="description" content="ระบบคำนวณสารอาหารทางหลอดเลือดดำ (TPN) สำหรับทารกแรกเกิดและเด็ก" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#0d6e6e" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="PediCalc" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96x96.png" />

    <!-- Windows tile -->
    <meta name="msapplication-TileColor" content="#0d6e6e" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- Preload critical self-hosted fonts (eliminates Google Fonts round-trip) -->

    <link rel="preload" href="/fonts/Sarabun-SemiBold.ttf" as="font" type="font/ttf" crossorigin />
